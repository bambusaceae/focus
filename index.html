<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c1e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
<title>Focus Grid</title>
<style>
  /* Layout: lock-screen stack — date + big clock up top, empty middle, notification card above two round corner buttons. */
  :root {
    --bg: #f4f3ef;
    --card: #ffffff;
    --chip: #ebe9e4;
    --fg: #2b2d30;
    --muted: #8a8c90;
    --line: #dcdad4;
    --accent: #4f6478;
    --on-accent: #ffffff;
    --prosing: #a3366c;
    --working: #27406e;
    --cell0: #e6e4df;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    --font-clock: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c1e; --card: #26272a; --chip: #333438; --fg: #e8e8e8; --muted: #8e9096; --line: #34363a;
      --accent: #8da3b8; --on-accent: #1b1c1e;
      --prosing: #d0679b; --working: #7194d2;
      --cell0: #2f3034;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1c1e; --card: #26272a; --chip: #333438; --fg: #e8e8e8; --muted: #8e9096; --line: #34363a;
    --accent: #8da3b8; --on-accent: #1b1c1e;
    --prosing: #d0679b; --working: #7194d2;
    --cell0: #2f3034;
    color-scheme: dark;
  }

  /* skins (chosen in Settings). Default follows the system's light/dark; the others are fixed light themes */
  :root[data-skin="chocomint"] { --clock: #6b4532; --bg: #cfe8da; --card: #f2faf5; --chip: #bddccb; --fg: #3a291f; --muted: #6c7f74; --line: #b3d3c1; --accent: #6b4532; --on-accent: #ffffff; --prosing: #6b4532; --working: #2c7671; --cell0: #c2dfcf; color-scheme: light; }
  :root[data-skin="claude"] { --bg: #f5f0e8; --card: #fffdf9; --chip: #ece5da; --fg: #2f2a24; --muted: #8c8478; --line: #e3dbcf; --accent: #d97757; --on-accent: #ffffff; --prosing: #d97757; --working: #6b5a4a; --cell0: #e9e2d6; color-scheme: light; }
  :root[data-skin="lemonnavy"] { --clock: #1d3a8a; --bg: #fbf6d8; --card: #fffdf0; --chip: #f2ebc2; --fg: #1d2a4a; --muted: #7f8193; --line: #ece3b6; --accent: #1d3a8a; --on-accent: #ffffff; --prosing: #7fa61a; --working: #1d3a8a; --cell0: #efe7bd; color-scheme: light; }
  :root[data-skin="obsidian"] { --clock: #222222; --bg: #ffffff; --card: #f6f6f6; --chip: #ebebeb; --fg: #222222; --muted: #8a8a8a; --line: #e3e3e3; --accent: #7f6df2; --on-accent: #ffffff; --prosing: #7f6df2; --working: #45379e; --cell0: #ececec; color-scheme: light; }
  :root[data-skin="coralbutter"] { --clock: #ff6f61; --bg: #fff4d1; --card: #fffcf0; --chip: #f6eabd; --fg: #2d2618; --muted: #968c74; --line: #efe2b4; --accent: #ff6f61; --on-accent: #ffffff; --prosing: #ff6f61; --working: #a63d55; --cell0: #f4e8bd; color-scheme: light; }
  /* Blueprint: drafting grid, outlined glass cards */

  /* Rain: a quiet night window — slate blue, soft rain falling behind everything */
  :root[data-skin="rain"] { --clock: #e6edf3; --bg: #1c2731; --card: rgba(16,23,30,.74); --chip: rgba(255,255,255,.08); --fg: #dde6ee; --muted: #8597a6; --line: rgba(255,255,255,.1); --accent: #a8c2d6; --on-accent: #16202a; --prosing: #c3b2e2; --working: #86c3c4; --cell0: #283642; color-scheme: dark; }
  [data-skin="rain"] .card { border: 1px solid rgba(255,255,255,.07); }
  [data-skin="rain"] .date { opacity: .7; }
  .rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; display: none; }
  [data-skin="rain"] .rain { display: block; }
  [data-skin="rain"] .app { position: relative; z-index: 1; }
  /* Snow: a quiet winter dusk — soft flakes drifting down behind everything */
  :root[data-skin="snow"] { --clock: #fbefe0; --bg: #2e2521; --card: rgba(44,34,29,.84); --chip: rgba(255,232,205,.09); --fg: #f6eadb; --muted: #b9a593; --line: rgba(255,230,200,.15); --accent: #f1c88f; --on-accent: #3a281c; --prosing: #f1c88f; --working: #ffffff; --cell0: #40332c; color-scheme: dark; }
  [data-skin="snow"] body { background-image: radial-gradient(ellipse 90% 60% at 50% 22%, rgba(255,196,140,.11), rgba(255,196,140,0) 70%); background-attachment: fixed; }
  [data-skin="snow"] .card { border: 1px solid rgba(255,225,190,.1); }
  [data-skin="snow"] .date { opacity: .8; }
  [data-skin="snow"] .rain { display: block; }
  [data-skin="snow"] .app { position: relative; z-index: 1; }
  /* Tea room: tatami and matcha, a thread of steam rising behind the dial */
  :root[data-skin="tea"] { --clock: #4a4636; --bg: #e8e0c8; --card: #f6f1e1; --chip: #e3dbc2; --fg: #3c392b; --muted: #8b846b; --line: #d6ccb0; --accent: #6d8740; --on-accent: #ffffff; --prosing: #6d8740; --working: #8e4c4a; --cell0: #ddd4b9; color-scheme: light; }
  [data-skin="tea"] body { background-image: repeating-linear-gradient(0deg, rgba(120,104,60,.05) 0 1px, transparent 1px 5px); }
  [data-skin="tea"] .card { border: 1px solid #ddd3b6; }
  /* Sakura: pale blossom pink, petals drifting down */
  :root[data-skin="sakura"] { --clock: #5a3f47; --bg: #fbf0f1; --card: #fffafa; --chip: #f4e4e7; --fg: #4a383d; --muted: #a58c93; --line: #f0dadf; --accent: #d9788f; --on-accent: #ffffff; --prosing: #df7893; --working: #7aa267; --cell0: #f2e3e6; color-scheme: light; }
  [data-skin="sakura"] .card { border: 1px solid #f3dfe3; }
  [data-skin="tea"] .rain, [data-skin="sakura"] .rain { display: block; }

  /* Tea Room — mincho type, square corners, a tatami-edge band across the top of the card, a stitched ring track */
  :root[data-skin="tea"] { --font-ui: "Tea Mincho", "Hiragino Mincho ProN", serif; --font-clock: "Tea Mincho", "Hiragino Mincho ProN", serif; }
  [data-skin="tea"] .clock { font-weight: 400; letter-spacing: .02em; }
  [data-skin="tea"] .date { letter-spacing: .14em; font-size: 17px; }
  [data-skin="tea"] .card { border-radius: 3px; border-top: 5px solid #5c6d3a; }
  [data-skin="tea"] .act, [data-skin="tea"] .seg, [data-skin="tea"] .tag, [data-skin="tea"] .picker .band, [data-skin="tea"] .field { border-radius: 3px; }
  [data-skin="tea"] .seg .thumb, [data-skin="tea"] .seg button { border-radius: 2px; }
  [data-skin="tea"] .act, [data-skin="tea"] .seg button, [data-skin="tea"] .tag { letter-spacing: .08em; }
  [data-skin="tea"] .mark .track { stroke-dasharray: 1.6 2.6; stroke: #b9ad8a; stroke-width: 1.4; }
  [data-skin="tea"] .mark .ring { stroke-width: 1.8; }
  [data-skin="tea"] .cell { border-radius: 1px; }

  /* Sakura — airy Garamond with an italic date, soft round shapes, a hairline ring */
  :root[data-skin="sakura"] { --font-ui: "Sakura Serif", "Cormorant Garamond", Georgia, serif; --font-clock: "Sakura Serif", Georgia, serif; }
  [data-skin="sakura"] body { font-weight: 500; }
  [data-skin="sakura"] body, [data-skin="sakura"] .clock { font-variant-numeric: lining-nums tabular-nums; }
  [data-skin="sakura"] .clock { font-weight: 300; letter-spacing: .01em; }
  [data-skin="sakura"] .top .dial .clock { font-size: calc(var(--ring) * .25); }
  [data-skin="sakura"] .date { font-style: italic; font-weight: 400; font-size: 23px; opacity: 1; }
  [data-skin="sakura"] .top.won .date { font-size: 31px; font-weight: 400; }
  [data-skin="sakura"] .card { border-radius: 30px; padding: 16px; }
  [data-skin="sakura"] .act { border-radius: 22px; font: 500 18px/1 var(--font-ui); letter-spacing: .02em; }
  [data-skin="sakura"] .seg { border-radius: 20px; }
  [data-skin="sakura"] .seg .thumb, [data-skin="sakura"] .seg button { border-radius: 17px; }
  [data-skin="sakura"] .seg button, [data-skin="sakura"] .tag { font: 500 16px/1 var(--font-ui); }
  [data-skin="sakura"] .picker .band { border-radius: 16px; }
  [data-skin="sakura"] .wheel .wi, [data-skin="sakura"] .picker .unit { font-size: 17px; font-weight: 500; }
  [data-skin="sakura"] .card-title, [data-skin="sakura"] .card-sub { font-size: 16px; }
  [data-skin="sakura"] .mark .ring, [data-skin="sakura"] .mark .track { stroke-width: 1.4; }
  [data-skin="sakura"] .cell { border-radius: 50%; }


  [data-skin="tea"] .app, [data-skin="sakura"] .app { position: relative; z-index: 1; }
  .skin .sw.t-tea { background-image: repeating-linear-gradient(0deg, rgba(120,104,60,.14) 0 1px, transparent 1px 4px) !important; }
  .skin .sw.t-sakura { background-image: radial-gradient(ellipse 2.4px 1.5px, rgba(223,120,147,.75) 98%, transparent), radial-gradient(ellipse 1.8px 1.2px, rgba(223,120,147,.5) 98%, transparent) !important; background-size: 13px 13px, 17px 17px !important; background-position: 2px 3px, 9px 10px !important; }

  [data-skin="chocomint"] .clock { font-weight: 600; letter-spacing: 0; color: var(--ink); }
  [data-skin="chocomint"] .top .dial .clock { font-size: calc(var(--ring) * .205); }
    [data-skin="chocomint"] .date { font-family: var(--font-ui); font-weight: 600; opacity: 1; color: var(--ink); }
  [data-skin="chocomint"] .card { border: 2.5px solid var(--ink); border-radius: 24px; box-shadow: 0 5px 0 var(--ink); }
  [data-skin="chocomint"] .card-title, [data-skin="chocomint"] .stat .k, [data-skin="chocomint"] .section-k b { font-weight: 700; }
  [data-skin="chocomint"] .act, [data-skin="chocomint"] .chipbtn { border: 2px solid var(--ink); border-radius: 14px; font-weight: 600; box-shadow: 0 3px 0 var(--ink); }
  [data-skin="chocomint"] .act { height: 40px; }
  [data-skin="chocomint"] .act:active, [data-skin="chocomint"] .chipbtn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); opacity: 1; }
  [data-skin="chocomint"] .act.primary { background: var(--ink); }

      <button class="tool" id="btn-cal" type="button" aria-label="History" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="8.5" cy="13.3" r=".6" fill="currentColor" stroke="none"/><circle cx="12" cy="13.3" r=".6" fill="currentColor" stroke="none"/><circle cx="15.5" cy="13.3" r=".6" fill="currentColor" stroke="none"/><circle cx="8.5" cy="16.8" r=".6" fill="currentColor" stroke="none"/><circle cx="12" cy="16.8" r=".6" fill="currentColor" stroke="none"/></svg></button>
      <button class="tool" id="btn-theme" type="button" aria-label="Theme" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5c.7 1.3 1.8 1.9 3 1.9s2.3-.6 3-1.9l5.5 2.4-1.9 4.2-2.3-.9v8.8H6.7v-8.8l-2.3.9-1.9-4.2L9 5z"/></svg></button>
    </span>
  </div>
</div>

<script>
(() => {
  const K = { skin: 'fg.skin', minutes: 'fg.minutes', records: 'fg.records', sessions: 'fg.sessions', session: 'fg.session', cat: 'fg.category', token: 'fg.token', repo: 'fg.repo', synced: 'fg.syncedAt', dirty: 'fg.dirty' };
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const drop = (k) => { try { localStorage.removeItem(k); } catch (e) {} };

  const CATS = { prosing: 'Writing', working: 'Working' };

  // ---------- skins ----------
  const SKINS = [
    ['obsidian',  'Obsidian',  '#ffffff', '#7f6df2', '#f6f6f6'],
    ['chocomint', 'Chocomint', '#cfe8da', '#6b4532', '#f2faf5'],
    ['lemonnavy', 'Lemon', '#fbf6d8', '#1d3a8a', '#fffdf0'],
    ['coralbutter', 'Coral', '#fff4d1', '#ff6f61', '#fffcf0'],
    ['rain',      'Rain',      '#1c2731', '#a8c2d6', '#283642'],
    ['snow',      'Snow',      '#3a2d27', '#f1c88f', '#40332c'],
    ['tea',       'Tea Room',  '#e8e0c8', '#6d8740', '#f6f1e1'],
    ['sakura',    'Sakura',    '#fbf0f1', '#d9788f', '#fffafa'],
  ];

  // ---------- rain (Rain skin only) ----------
  const rain = (() => {
    const cv = document.getElementById('rain'), cx = cv.getContext('2d');
    let on = false, raf = 0, w = 0, h = 0, dpr = 1, last = 0, drops = [], beads = [];
    const still = matchMedia('(prefers-reduced-motion: reduce)');
    const rnd = (a, b) => a + Math.random() * (b - a);
    const WIND = 0.12;                                   // slight slant
    const drop = (y) => {
      const near = Math.random() < 0.18;                 // a few closer, brighter streaks
      return { x: rnd(-40, w + 40), y: y ?? rnd(-h, h), len: near ? rnd(22, 34) : rnd(10, 20),
               v: near ? rnd(820, 1000) : rnd(480, 700), a: near ? rnd(.22, .32) : rnd(.08, .18), lw: near ? 1.2 : .8 };
    };
    const bead = () => ({ x: rnd(10, w - 10), y: rnd(0, h), r: rnd(1.2, 2.6), v: 0, hold: rnd(2, 9), a: rnd(.18, .3) });
    function size() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      const n = Math.round(w * h / 2600);
      drops = Array.from({ length: n }, () => drop());
      beads = Array.from({ length: Math.round(w * h / 22000) }, bead);
    }
    function draw(dt) {
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx.clearRect(0, 0, w, h);
      cx.lineCap = 'round';
      for (const d of drops) {
        d.y += d.v * dt; d.x += d.v * WIND * dt;
        if (d.y - d.len > h) Object.assign(d, drop(rnd(-60, -10)));
        cx.strokeStyle = `rgba(200,220,235,${d.a})`; cx.lineWidth = d.lw;
        cx.beginPath(); cx.moveTo(d.x, d.y); cx.lineTo(d.x - d.len * WIND, d.y - d.len); cx.stroke();
      }
      // beads on the glass: sit still, then slowly slide down and leave
      for (const b of beads) {
        if (b.hold > 0) b.hold -= dt; else { b.v = Math.min(60, b.v + 30 * dt); b.y += b.v * dt; }
        if (b.y - b.r > h) Object.assign(b, bead(), { y: rnd(0, h * .6) });
        cx.fillStyle = `rgba(210,228,240,${b.a})`;
        cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, Math.PI * 2); cx.fill();
        if (b.v > 0) { cx.fillStyle = `rgba(210,228,240,${b.a * .25})`; cx.fillRect(b.x - b.r * .35, b.y - 26, b.r * .7, 26); }
      }
    }
    function loop(t) {
      const dt = Math.min(.05, last ? (t - last) / 1000 : 0); last = t;
      draw(dt);
      raf = on && !still.matches ? requestAnimationFrame(loop) : 0;
    }
    function set(v) {
      if (v === on) return;
      on = v; cancelAnimationFrame(raf); raf = 0; last = 0;
      if (on) { size(); raf = requestAnimationFrame(loop); } else cx.clearRect(0, 0, cv.width, cv.height);
    }
    addEventListener('resize', () => { if (on) { size(); if (!raf) draw(0); } });
    document.addEventListener('visibilitychange', () => { if (on && !document.hidden && !raf) { last = 0; raf = requestAnimationFrame(loop); } });
    return { set };
  })();

  // ---------- snow (Snow skin only), drawn on the same canvas ----------
  const snow = (() => {
    const cv = document.getElementById('rain'), cx = cv.getContext('2d');
    let on = false, raf = 0, w = 0, h = 0, dpr = 1, last = 0, flakes = [], t = 0;
    const still = matchMedia('(prefers-reduced-motion: reduce)');
    const rnd = (a, b) => a + Math.random() * (b - a);
    // one soft, blurred flake drawn once and stamped at every size
    const sprite = document.createElement('canvas'); sprite.width = sprite.height = 64;
    { const g = sprite.getContext('2d'), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      rg.addColorStop(0, 'rgba(255,246,234,1)'); rg.addColorStop(.35, 'rgba(255,246,234,.85)');
      rg.addColorStop(.7, 'rgba(255,246,234,.25)'); rg.addColorStop(1, 'rgba(255,246,234,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 64, 64); }
    const flake = (y) => {
      const z = Math.random();                           // 0 = far, 1 = near
      return { x: rnd(0, w), y: y ?? rnd(-h, h), r: 3 + z * 7, v: 16 + z * 44, a: .35 + z * .55,
               sway: rnd(6, 22), ph: rnd(0, Math.PI * 2), sp: rnd(.4, 1.1) };
    };
    function size() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      flakes = Array.from({ length: Math.round(w * h / 5200) }, () => flake());
    }
    function draw(dt) {
      t += dt;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx.clearRect(0, 0, w, h);
      cx.globalAlpha = 1;
      for (const f of flakes) {
        f.y += f.v * dt; f.x += 6 * dt;                   // a faint drift to the right
        if (f.y - f.r > h) Object.assign(f, flake(rnd(-30, -5)));
        const x = ((f.x + Math.sin(t * f.sp + f.ph) * f.sway) % (w + 20) + w + 20) % (w + 20) - 10;
        cx.globalAlpha = f.a;
        cx.drawImage(sprite, x - f.r, f.y - f.r, f.r * 2, f.r * 2);
      }
      cx.globalAlpha = 1;
    }
    function loop(ts) {
      const dt = Math.min(.05, last ? (ts - last) / 1000 : 0); last = ts;
      draw(dt);
      raf = on && !still.matches ? requestAnimationFrame(loop) : 0;
    }
    function set(v) {
      if (v === on) return;
      on = v; cancelAnimationFrame(raf); raf = 0; last = 0;
      if (on) { size(); raf = requestAnimationFrame(loop); }
    }
    addEventListener('resize', () => { if (on) { size(); if (!raf) draw(0); } });
    document.addEventListener('visibilitychange', () => { if (on && !document.hidden && !raf) { last = 0; raf = requestAnimationFrame(loop); } });
    return { set };
  })();

  // ---------- small canvas scenes for Tea Room and Sakura (same canvas as the rain) ----------
  function scene(build) {
    const cv = document.getElementById('rain'), cx = cv.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)');
    let on = false, raf = 0, last = 0, t = 0, w = 0, h = 0, dpr = 1, st = null;
    function size() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      st = build.init(w, h);
    }
    function loop(ts) {
      const dt = Math.min(.05, last ? (ts - last) / 1000 : 0); last = ts; t += dt;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx.clearRect(0, 0, w, h);
      cx.globalAlpha = 1;
      build.frame(cx, st, dt, t, w, h);
      cx.globalAlpha = 1;
      raf = on && !still.matches ? requestAnimationFrame(loop) : 0;
    }
    function set(v) {
      if (v === on) return;
      on = v; cancelAnimationFrame(raf); raf = 0; last = 0;
      if (on) { size(); raf = requestAnimationFrame(loop); }
    }
    addEventListener('resize', () => { if (on) { size(); if (!raf) requestAnimationFrame(loop); } });
    document.addEventListener('visibilitychange', () => { if (on && !document.hidden && !raf) { last = 0; raf = requestAnimationFrame(loop); } });
    return { set };
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // Tea Room: two or three soft threads of steam rising from behind the top of the dial
  const tea = scene({
    init: () => ({ wisps: [0, 1, 2].map((i) => ({ off: i * 0.37, x: (i - 1) * 16, ph: rnd(0, 6) })) }),
    frame(cx, st, dt, t) {
      const d = document.getElementById('dial'); if (!d) return;
      const r = d.getBoundingClientRect();
      const x0 = r.left + r.width / 2, y0 = r.top + r.height * .08, rise = r.top + 10;   // up to the "Today" line
      cx.lineCap = 'round';
      for (const wsp of st.wisps) {
        const p = ((t / 6) + wsp.off) % 1;             // each thread drifts up and fades, over and over
        const pts = [];
        for (let k = 0; k <= 24; k++) {
          const q = k / 24, y = y0 - q * (rise * .9) * (0.55 + p * .6);
          const x = x0 + wsp.x * (1 - q * .4) + Math.sin(q * 5 + t * .9 + wsp.ph) * (6 + q * 16);
          pts.push([x, y]);
        }
        const fade = Math.sin(p * Math.PI);
        for (const [lw, a] of [[16, .05], [9, .08], [4, .12]]) {
          cx.strokeStyle = `rgba(255,255,255,${a * fade * 3})`; cx.lineWidth = lw;
          cx.beginPath(); pts.forEach(([x, y], k) => (k ? cx.lineTo(x, y) : cx.moveTo(x, y))); cx.stroke();
        }
      }
    },
  });

  // Sakura: petals that drift down, turning and flipping as they fall
  const sakura = scene({
    init: (w, h) => ({ petals: Array.from({ length: Math.round(w * h / 7500) }, () => petal(w, h, rnd(-h, h))) }),
    frame(cx, st, dt, t, w, h) {
      for (const p of st.petals) {
        p.y += p.v * dt; p.x += (14 + Math.sin(t * .5 + p.ph) * 10) * dt; p.rot += p.vr * dt; p.flip += p.vf * dt;
        if (p.y > h + 20 || p.x > w + 30) Object.assign(p, petal(w, h, rnd(-40, -10)));
        cx.save();
        cx.translate(p.x + Math.sin(t * p.sp + p.ph) * p.sway, p.y);
        cx.rotate(p.rot); cx.scale(Math.cos(p.flip) * .9 + .1 * Math.sign(Math.cos(p.flip) || 1), 1);
        cx.globalAlpha = p.a; cx.fillStyle = p.c;
        const s = p.s;
        cx.beginPath();                                    // a petal: rounded body with a small notch at the tip
        cx.moveTo(0, -s);
        cx.bezierCurveTo(s * .9, -s * .6, s * .8, s * .7, s * .12, s);
        cx.lineTo(0, s * .78);
        cx.lineTo(-s * .12, s);
        cx.bezierCurveTo(-s * .8, s * .7, -s * .9, -s * .6, 0, -s);
        cx.fill();
        cx.restore();
      }
    },
  });
  function petal(w, h, y) {
    const z = Math.random();
    return { x: rnd(-30, w), y, s: 5 + z * 6, v: 22 + z * 34, a: .45 + z * .45, rot: rnd(0, 6), vr: rnd(-1.2, 1.2),
             flip: rnd(0, 6), vf: rnd(1, 2.6), sway: rnd(8, 24), sp: rnd(.5, 1.2), ph: rnd(0, 6),
             c: ['#f6b9c8', '#f3a6ba', '#fbcdd8', '#eea0b4'][Math.floor(Math.random() * 4)] };
  }
  function applySkin(k) {
    const root = document.documentElement;
    if (!SKINS.some((x) => x[0] === k)) k = 'obsidian';    // Obsidian is the default look
    root.dataset.skin = k;
    rain.set(root.dataset.skin === 'rain');
    snow.set(root.dataset.skin === 'snow');
    tea.set(k === 'tea'); sakura.set(k === 'sakura');
    requestAnimationFrame(() => {
      const bg = getComputedStyle(document.body).backgroundColor;
      document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', bg));
    });
  }

  let minutes = load(K.minutes, 25);
  let category = load(K.cat, 'prosing');
  if (!CATS[category]) category = 'prosing';
  // legacy: day totals saved before sync existed { "2026-10-07": { s, n, c: { prosing: { s, n }, working: { s, n } } } }
  let legacy = load(K.records, {});
  // sessions: one entry per completed session { id, start, minutes, category } — merges cleanly across devices
  let sessions = load(K.sessions, []);
  let records = {};                          // derived day totals = legacy + sessions
  function rebuild() {
    records = JSON.parse(JSON.stringify(legacy));
    for (const x of sessions) {
      const key = dayKey(new Date(x.start));
      const r = records[key] || (records[key] = { s: 0, n: 0 });
      const add = x.minutes * 60;
      r.s += add; r.n += 1;
      r.c = r.c || {};
      const c = r.c[x.category] || (r.c[x.category] = { s: 0, n: 0 });
      c.s += add; c.n += 1;
    }
  }
  let session = load(K.session, null);      // { start, end, minutes, category }
  let phase = 'idle';                        // idle | focusing | confirm | success | failed
  let view = 'timer';                        // timer | cal
  let filter = 'all';                        // all | prosing | working
  let last = { minutes, category };
  let failText = '';
  let celebrate = false;
  let countRaf = 0;
  let selected = null;
  let panel = 'history';                     // history | theme | sync (which card the bottom tools opened)
  let syncState = { busy: false, error: '' };

  const PRESETS = [[30, '30 min'], [60, '1 hour'], [90, '1.5 hours']];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtDur = (sec) => {
    const m = Math.floor(sec / 60);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h}h ${r}m` : `${h}h`;
  };
  const clock = (sec) => `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
  const hhmm = (t) => { const d = new Date(t); return `${d.getHours()}:${pad(d.getMinutes())}`; };
  const longDate = (d) => `${DOW_LONG[d.getDay()]}, ${MONTHS_LONG[d.getMonth()]} ${d.getDate()}`;
  rebuild();

  // ---------- timer logic ----------
  function start() {
    const now = Date.now();
    last = { minutes, category };
    session = { start: now, end: now + minutes * 60000, minutes, category };
    save(K.session, session);
    phase = 'focusing';
    render();
  }
  function complete() {
    const cat = session.category || 'prosing';
    if (session.minutes >= 1) {           // the 3-second test session is never recorded
      sessions.push({ id: `${session.start}-${Math.random().toString(36).slice(2, 8)}`, start: session.start, minutes: session.minutes, category: cat });
      save(K.sessions, sessions);
      save(K.dirty, Date.now());           // a new record that GitHub doesn't have yet
      rebuild();
      sync();
    }
    last = { minutes: session.minutes, category: cat };
    session = null; drop(K.session);
    phase = 'success';
    celebrate = true;                       // play the ring once, when the page is actually on screen
    render();
  }
  function fail(text) {
    if (session) last = { minutes: session.minutes, category: session.category || category, done: Math.min(1, Math.max(0, (Date.now() - session.start) / (session.end - session.start))) };
    session = null; drop(K.session);
    failText = text;
    phase = 'failed';
    render();
  }
  // Any time the page is hidden (another app, home screen, or screen lock), the session ends.
  function leave() {
    if ((phase === 'focusing' || phase === 'confirm') && session) {
      if (Date.now() >= session.end) complete();
      else fail('You left the page, so the session stopped.');
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') leave();
    else if (phase === 'success' && celebrate && view === 'timer') render();
    if (document.visibilityState === 'visible' && load(K.dirty, 0)) sync();
  });
  window.addEventListener('pagehide', leave);

  function tick() {
    if ((phase === 'focusing' || phase === 'confirm') && session) {
      const left = Math.max(0, Math.ceil((session.end - Date.now()) / 1000));
      setClock(left);
      setRing((Date.now() - session.start) / (session.end - session.start));
      if (left === 0) complete();
    }
  }
  setInterval(tick, 250);

  // ---------- building blocks ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const dot = (cat) => el('span', `dot ${cat}`);
  function act(label, cls, fn) {
    const b = el('button', `act ${cls || ''}`.trim(), label);
    b.type = 'button';
    b.addEventListener('click', fn);
    return b;
  }
  function head(title, sub, cat) {
    const h = el('div', 'card-head');
    const t = el('div', 'card-text');
    const tt = el('div', 'card-title');
    if (cat) tt.append(dot(cat));
    tt.append(document.createTextNode(title));
    t.append(tt);
    if (sub) t.append(el('div', 'card-sub', sub));
    h.append(t);
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    badge.setAttribute('viewBox', '0 0 24 24'); badge.setAttribute('class', 'badge');
    badge.innerHTML = '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
    h.append(badge);
    return h;
  }
  function actions(...btns) {
    const a = el('div', btns.length === 1 ? 'actions one' : 'actions');
    a.append(...btns);
    return a;
  }
  const segPrev = {};
  function segmented(name, options, value, onPick) {
    const s = el('div', 'seg');
    const n = options.length;
    const idx = Math.max(0, options.findIndex((o) => o[0] === value));
    const thumb = el('div', 'thumb');
    thumb.style.width = `calc((100% - 5px - ${(n - 1) * 4}px) / ${n})`;
    const at = (i) => `translateX(calc(${i * 100}% + ${i * 4}px))`;
    const from = segPrev[name] ?? idx;
    thumb.style.transition = 'none';
    thumb.style.transform = at(from);
    s.append(thumb);
    if (from !== idx) requestAnimationFrame(() => requestAnimationFrame(() => { thumb.style.transition = ''; thumb.style.transform = at(idx); }));
    else requestAnimationFrame(() => { thumb.style.transition = ''; });
    segPrev[name] = idx;
    for (const [key, label, withDot] of options) {
      const b = el('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(key === value));
      if (withDot) b.append(dot(key));
      b.append(document.createTextNode(label));
      b.addEventListener('click', () => onPick(key));
      s.append(b);
    }
    return s;
  }

  // ---------- wheel picker ----------
  function wheel(values, value, label, onChange) {
    const w = el('div', 'wheel');
    w.tabIndex = 0;
    w.setAttribute('role', 'spinbutton');
    w.setAttribute('aria-label', label);
    w.append(el('div', 'pad'));
    const items = values.map((v) => { const i = el('div', 'wi', String(v)); w.append(i); return i; });
    w.append(el('div', 'pad'));
    let row = 32, idx = Math.max(0, values.indexOf(value)), settle = 0, raf = 0;
    const paint = () => {
      raf = 0;
      const mid = w.scrollTop / row;
      items.forEach((it, i) => {
        const d = i - mid;
        if (Math.abs(d) > 3) { it.style.opacity = '0'; return; }
        if (Math.abs(d) < 0.04) { it.style.opacity = '1'; it.style.transform = 'none'; return; } // centred row renders as plain text, same as the buttons
        it.style.opacity = String(Math.max(0, 1 - Math.abs(d) * 0.3));

  async function api(path, opts = {}) {

        'Authorization': `Bearer ${getToken()}`,

      for (let attempt = 0; attempt < 2; attempt++) {
        let sha;
        const get = await api('data.json');

          const j = await get.json();
          sha = j.sha;
          mergeData(JSON.parse(b64decode(j.content)));
        } else if (get.status === 401) {
          throw new Error('the token was rejected');

        if (sha) body.sha = sha;

  const THEMES = ['chocomint', 'rain', 'snow', 'tea', 'sakura'];   // skins that change more than colour

    const sec = (t) => { const h = el('div', 'section-k'); h.append(el('b', '', t)); return h; };
    card.append(sec('Colors'), grid(SKINS.map((x) => x[0]).filter((k) => !THEMES.includes(k))),

  window.addEventListener('online', () => sync());

  // ---------- bottom buttons ----------
  function openPanel(name) {

  sync();
  setInterval(() => { $('date').textContent = `Today ${fmtDur(rec(new Date()).s)}${phase === 'success' && view === 'timer' ? '!' : ''}`; }, 60000);
})();

    const flick = fl >= 0 && fl < 0.9 ? 0.24 * (1 - fl / 0.9) : 0;

    // turns its head to look back when you go behind it
    const theta = Math.atan2(Math.sin(azim), Math.cos(azim));
    const behind = Math.abs(theta) > 2.0;
    let yawTarget = 0;
    if (lookState === 'idle') {
      if (behind && !annoyed) {
        if (behindSince < 0) behindSince = now;
        if (now - behindSince > 0.4) { lookState = 'look'; lookStart = now; lookSign = Math.sign(theta) || 1; lookBlinked = false; }
      } else behindSince = -1;
    } else if (lookState === 'look') {
      yawTarget = lookSign * 1.5;
      if (!lookBlinked && now - lookStart > 0.9) { blink(now); lookBlinked = true; }
      if (now - lookStart > 2.1) lookState = 'back';
    } else if (lookState === 'back' && !behind) { lookState = 'idle'; behindSince = -1; }
    headYaw += (yawTarget - headYaw) * Math.min(1, dt * 4.5);

    headGroup.rotation.set(
      -happy * 0.1 + sad * 0.34,
      headYaw + Math.sin(at * 13) * 0.32 * env,
      Math.sin(at * 9) * 0.14 * env + Math.sin(now * 2.6) * 0.07 * happy + (lookState === 'look' ? lookSign * 0.06 : 0));
    bunny.rotation.z = Math.sin(at * 9 + 1) * 0.03 * env;
    // ears: lean back when petted, flap when annoyed, flick on success, flop forward when sad
    ears.forEach((ear, i) => ear.grp.rotation.set(
      -happy * 0.3 + sad * 1.15,
      0,
      Math.sin(at * 15 + i * 2) * 0.16 * env + Math.sin(fl * 30 + i * 1.3) * flick + sad * (i === 0 ? 0.12 : -0.12)));

    const joy = Math.max(happy, glow);
    if (now >= nextBlink && joy < 0.3 && !annoyed) { blink(now); scheduleNext(now); }
    let lid = 1;
    if (blinkStart >= 0) {
      const p = (now - blinkStart) / BLINK;
      if (p >= 1) blinkStart = -1; else lid = 1 - Math.sin(Math.PI * p) * 0.9;
    }
    const ss = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
    const ballFade = 1 - ss(0.15, 0.65, joy), arcFade = ss(0.3, 0.8, joy);
    const open = lid * (1 - 0.62 * env), shrink = 1 - 0.35 * joy;
    ballMat.opacity = ballFade; arcMat.opacity = arcFade;
    eyes.forEach(e => {
      e.ball.visible = ballFade > 0.01;
      e.ball.scale.set(shrink, 1.18 * Math.max(0.06, open) * shrink * (1 - 0.3 * sad), 0.55);
      e.arc.visible = arcFade > 0.01;
      const g = 0.75 + 0.25 * joy;
      e.arc.scale.set(g, g, 0.6);
    });
    const flush = Math.max(happy, glow);
    blushMat.color.copy(blushLight).lerp(blushDeep, flush);
    blushMat.opacity = 0.72 + 0.23 * flush;
    blushes.forEach(b => b.scale.set(1.25 * (1 + 0.15 * flush), 0.8 * (1 + 0.15 * flush), 0.18));

    // tears: each one swells under the eye, runs down the cheek and fades, over and over
    tears.forEach(t => {
      const show = sad * (1 - happy);
      t.drop.visible = show > 0.02;
      if (!t.drop.visible) return;
      const p = ((now - sadStart) / 1.8 + t.off) % 1;
      const grow = Math.min(1, p / 0.25), run = Math.max(0, (p - 0.25) / 0.75);
      t.drop.scale.set(0.8 * grow, 1.15 * grow * (1 + run * 0.3), 0.6 * grow);
      t.drop.position.set(0, -run * 0.34, 0.012);
      t.mat.opacity = show * 0.85 * (run > 0.7 ? 1 - (run - 0.7) / 0.3 : 1);
    });

    squish *= 0.85;
    const breathe = reduceMotion ? 0 : Math.sin(now * 1.6) * 0.006;
    bunny.scale.set(1 + squish * 0.04, 1 + breathe - squish * 0.05 - sad * 0.03, 1 + squish * 0.04);

    renderer.render(scene, camera);
    raf = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', wake);

  window.fgBunny = {
    set(o) {
      busy = !!o.busy; active = o.active !== false;
      glassGroup.visible = !!o.glasses;
      stage.classList.toggle('busy', busy);
      if (busy) { petting = false; tapTimes = []; azim = Math.atan2(Math.sin(azim), Math.cos(azim)); }
      const m = o.mood || 'idle';
      if (m === 'failed' && mood !== 'failed') sadStart = clock.getElapsedTime();
      mood = m;
      wake();
    },
    celebrate() { hopAt = clock.getElapsedTime() + 0.8; landed = false; wake(); },
  };
  if (window.fgBunnyCelebrate) { window.fgBunnyCelebrate = false; window.fgBunny.celebrate(); }
  if (window.fgBunnyState) window.fgBunny.set(window.fgBunnyState);
  resize();
  wake();
})();
</script>
</body>
</html>
