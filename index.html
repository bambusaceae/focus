<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c1e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
<title>Focus Grid</title>
<style>
  /* Layout: lock-screen stack — date + big clock up top, empty middle, notification card above two round corner buttons. */
  :root {
    --bg: #f4f3ef;
    --card: #ffffff;
    --chip: #ebe9e4;
    --fg: #2b2d30;
    --muted: #8a8c90;
    --line: #dcdad4;
    --accent: #4f6478;
    --on-accent: #ffffff;
    --prosing: #a3366c;
    --working: #27406e;
    --cell0: #e6e4df;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    --font-clock: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c1e; --card: #26272a; --chip: #333438; --fg: #e8e8e8; --muted: #8e9096; --line: #34363a;
      --accent: #8da3b8; --on-accent: #1b1c1e;
      --prosing: #d0679b; --working: #7194d2;
      --cell0: #2f3034;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1c1e; --card: #26272a; --chip: #333438; --fg: #e8e8e8; --muted: #8e9096; --line: #34363a;
    --accent: #8da3b8; --on-accent: #1b1c1e;
    --prosing: #d0679b; --working: #7194d2;
    --cell0: #2f3034;
    color-scheme: dark;
  }

  /* skins (chosen in Settings). Default follows the system's light/dark; the others are fixed light themes */
  :root[data-skin="chocomint"] { --clock: #6b4532; --bg: #e2f0e8; --card: #f7fcf9; --chip: #d2e6da; --fg: #3a291f; --muted: #7b877f; --line: #c8ddd0; --accent: #6b4532; --on-accent: #ffffff; --prosing: #6b4532; --working: #2f7a62; --cell0: #d5e7dc; color-scheme: light; }
  :root[data-skin="claude"] { --bg: #f5f0e8; --card: #fffdf9; --chip: #ece5da; --fg: #2f2a24; --muted: #8c8478; --line: #e3dbcf; --accent: #d97757; --on-accent: #ffffff; --prosing: #d97757; --working: #6b5a4a; --cell0: #e9e2d6; color-scheme: light; }
  :root[data-skin="lemonnavy"] { --clock: #1d3a8a; --bg: #fbf6d8; --card: #fffdf0; --chip: #f2ebc2; --fg: #1d2a4a; --muted: #7f8193; --line: #ece3b6; --accent: #1d3a8a; --on-accent: #ffffff; --prosing: #d94f30; --working: #1d3a8a; --cell0: #efe7bd; color-scheme: light; }
  :root[data-skin="obsidian"] { --clock: #222222; --bg: #ffffff; --card: #f6f6f6; --chip: #ebebeb; --fg: #222222; --muted: #8a8a8a; --line: #e3e3e3; --accent: #7f6df2; --on-accent: #ffffff; --prosing: #7f6df2; --working: #2e9e9b; --cell0: #ececec; color-scheme: light; }
  :root[data-skin="coralbutter"] { --clock: #ff6f61; --bg: #fff4d1; --card: #fffcf0; --chip: #f6eabd; --fg: #2d2618; --muted: #968c74; --line: #efe2b4; --accent: #ff6f61; --on-accent: #ffffff; --prosing: #ff6f61; --working: #2f5d8a; --cell0: #f4e8bd; color-scheme: light; }
  :root[data-skin="blueprint"] { --clock: #ffffff; --bg: #1d4c9c; --card: transparent; --chip: rgba(255,255,255,.1); --fg: #eaf2ff; --muted: #a9c1ea; --line: rgba(255,255,255,.3); --accent: #ffffff; --on-accent: #1d4c9c; --prosing: #ffd166; --working: #9fe3ff; --cell0: #2a5aab; color-scheme: dark; }
  /* Blueprint: drafting grid, outlined glass cards */
  [data-skin="blueprint"] body { background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px; }
  [data-skin="blueprint"] .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.4); border-radius: 4px; }
  [data-skin="blueprint"] .seg, [data-skin="blueprint"] .chipbtn, [data-skin="blueprint"] .act:not(.primary) { background: rgba(255,255,255,.1); }
  [data-skin="blueprint"] .seg .thumb { background: rgba(255,255,255,.22); }
  [data-skin="blueprint"] .act, [data-skin="blueprint"] .chipbtn, [data-skin="blueprint"] .seg, [data-skin="blueprint"] .seg .thumb, [data-skin="blueprint"] .seg button { border-radius: 3px; }
  [data-skin="blueprint"] .stat .k, [data-skin="blueprint"] .date, [data-skin="blueprint"] .section-k b { font-family: ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; letter-spacing: .04em; }
  [data-skin="blueprint"] .clock { font-weight: 200; }

  html, body { height: 100%; touch-action: manipulation; }
  *, button { touch-action: manipulation; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-weight: 300;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .app {
    box-sizing: border-box;
    max-width: 440px;
    height: 100%;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 18px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* top: today total + clock — sits at the screen's centre, and rises only when a tall card needs the room */
  .top {
    position: absolute; left: 16px; right: 16px; top: 28px; z-index: 0;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: top .38s cubic-bezier(.3,.7,.2,1);
  }
  .date { font-size: 19px; font-weight: 400; opacity: .85; }
  .clock {
    color: var(--clock, var(--fg));
    font-family: var(--font-clock);
    font-weight: 200;
    font-size: clamp(76px, 24vw, 104px);
    line-height: 1.02;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .clock.dim { color: var(--muted); }
  .clock.small { font-size: clamp(56px, 17vw, 76px); }
  /* history overlay: a transparent layer catches taps outside the card */
  .scrim { position: fixed; inset: 0; z-index: 1; }
  .card, .bottom { position: relative; z-index: 2; }
  .round.ghost { visibility: hidden; }
  .app .bottom { justify-content: space-between; padding-inline: 2px; }
  .tools-right { display: flex; gap: 4px; }
  .tool {
    appearance: none; border: 0; background: none; cursor: pointer; padding: 0;
    width: 44px; height: 44px; display: grid; place-items: center;
    color: var(--muted); transition: color .2s ease, transform .14s ease, opacity .2s ease;
  }
  .tool svg { width: 25px; height: 25px; }
  .tool[aria-pressed="true"] { color: var(--fg); }
  .tool:active { transform: scale(.9); }
  .tool:disabled { opacity: .35; cursor: default; }
  .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  .card.leave { animation: sink .16s ease both; }
  @keyframes sink { to { opacity: 0; transform: translateY(8px); } }

  /* selected day inside the history card */
  .day { display: flex; flex-direction: column; gap: 6px; padding-inline: 2px; }
  .dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .dayhead .d { font-size: 15px; font-weight: 500; }
  .dayhead .v { font-size: 15px; font-variant-numeric: tabular-nums; }
  .sline { display: grid; grid-template-columns: 8px 3.2em 1fr auto; align-items: center; column-gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sline .dur { color: var(--fg); }
  .day .empty, .day .more { font-size: 13px; color: var(--muted); }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.prosing { background: var(--prosing); }
  .dot.working { background: var(--working); }

  .middle { flex: 1; min-height: 16px; }
  @media (prefers-reduced-motion: reduce) { .top { transition: none; } }

  /* notification card */
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-inline: 2px; }
  .card-text { min-width: 0; }
  .card-title { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .card-sub { font-size: 14px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .badge { flex: none; width: 18px; height: 18px; color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions.one { grid-template-columns: 1fr; }
  .act {
    appearance: none; border: 0; cursor: pointer;
    height: 42px; border-radius: 12px;
    font: 400 15px/1 var(--font-ui);
    background: var(--chip); color: var(--fg);
  }
  .act.primary { background: var(--accent); color: var(--on-accent); }
  .act.primary.prosing { background: var(--prosing); color: #fff; }
  .act.primary.working { background: var(--working); color: #fff; }
  .act, .chipbtn, .round, .syncrow { transition: transform .14s ease, opacity .14s ease, background-color .2s ease, color .2s ease; }
  .act:active, .chipbtn:active { transform: scale(.97); opacity: .85; }
  .round:active { transform: scale(.92); }
  .syncrow:active { opacity: .6; }
  .act:focus-visible, .round:focus-visible, .chipbtn:focus-visible, .seg button:focus-visible, .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* category / filter segmented control */
  .seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--chip); border-radius: 11px; padding: 2.5px; }
  .seg .thumb {
    position: absolute; top: 2.5px; bottom: 2.5px; left: 2.5px;
    border-radius: 8.5px; background: var(--card);
    transition: transform .28s cubic-bezier(.3,.7,.2,1);
  }
  .seg button {
    appearance: none; border: 0; cursor: pointer; background: transparent; color: var(--muted);
    position: relative; z-index: 1;
    height: 27px; border-radius: 8.5px;
    transition: color .2s ease;
    font: 400 14px/1 var(--font-ui);
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .seg button[aria-pressed="true"] { color: var(--fg); }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* wheel picker (hours / min), after the iOS Timer */
  .picker { --row: 32px; position: relative; display: grid; grid-template-columns: 1fr 1fr; height: calc(var(--row) * 5); }
  .picker .band {
    position: absolute; left: 0; right: 0; top: calc(var(--row) * 2); height: var(--row);
    background: var(--chip); border-radius: 11px; pointer-events: none;
  }
  .picker .col { position: relative; min-width: 0; }
  .picker .unit {
    position: absolute; left: 50%; top: calc(var(--row) * 2); height: var(--row); line-height: var(--row);
    padding-left: 7px; font-size: 15px; font-weight: 400; color: var(--fg); pointer-events: none; z-index: 2;
  }
  .wheel {
    position: relative; z-index: 1; width: 100%;
    height: calc(var(--row) * 5); overflow-y: scroll; scroll-snap-type: y mandatory;
    scrollbar-width: none; overscroll-behavior: contain; touch-action: pan-y; cursor: grab;
    perspective: 220px;
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel .pad { height: calc(var(--row) * 2); }
  .wheel .wi {
    height: var(--row); line-height: var(--row); scroll-snap-align: center;
    box-sizing: border-box; padding-right: 50%; text-align: right;
    font-size: 15px; font-weight: 400; font-variant-numeric: tabular-nums;
    color: var(--fg); transform-origin: center center;
  }
  .wheel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  .clock.long { font-size: clamp(60px, 18vw, 80px); }
  .chipbtn {
    appearance: none; border: 0; cursor: pointer;
    height: 32px; border-radius: 11px;
    font: 400 15px/1 var(--font-ui); font-variant-numeric: tabular-nums;
    background: var(--chip); color: var(--fg);
  }
  .chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* bottom row */
  .bottom { display: flex; align-items: center; justify-content: space-between; padding: 18px 10px 0; }
  .round {
    appearance: none; border: 0; cursor: pointer;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--chip); color: var(--fg);
    display: grid; place-items: center;
  }
  .round svg { width: 22px; height: 22px; }
  .round[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .round:disabled { opacity: .4; cursor: default; }
  .center-label { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* history */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-inline: 2px; }
  .stat .k { font-size: 12px; font-weight: 500; color: var(--fg); }
  .stat .v { font-size: 16px; font-weight: 400; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .rule { height: 1px; background: var(--line); }
  .graph-wrap { display: flex; gap: 6px; }
  .wk { display: grid; width: 22px; grid-template-rows: 14px repeat(7, 11px); row-gap: 3px; font-size: 9px; color: var(--muted); }
  .wk span { line-height: 11px; }
  .graph-scroll { overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
  .graph-scroll::-webkit-scrollbar { display: none; }
  .graph { display: grid; grid-auto-flow: column; grid-template-rows: 14px repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; width: max-content; padding-right: 1px; }
  .mlabel { font-size: 9px; color: var(--muted); white-space: nowrap; line-height: 14px; }
  .cell { width: 11px; height: 11px; border-radius: 2px; background: var(--cell0); border: 0; padding: 0; cursor: pointer; }
  .cell.l1 { background: color-mix(in srgb, var(--fg) 22%, var(--cell0)); }
  .cell.l2 { background: color-mix(in srgb, var(--fg) 45%, var(--cell0)); }
  .cell.l3 { background: color-mix(in srgb, var(--fg) 68%, var(--cell0)); }
  .cell.l4 { background: color-mix(in srgb, var(--fg) 90%, var(--cell0)); }
  .cell.p1 { background: color-mix(in srgb, var(--prosing) 30%, var(--cell0)); }
  .cell.p2 { background: color-mix(in srgb, var(--prosing) 55%, var(--cell0)); }
  .cell.p3 { background: color-mix(in srgb, var(--prosing) 80%, var(--cell0)); }
  .cell.p4 { background: var(--prosing); }
  .cell.w1 { background: color-mix(in srgb, var(--working) 30%, var(--cell0)); }
  .cell.w2 { background: color-mix(in srgb, var(--working) 55%, var(--cell0)); }
  .cell.w3 { background: color-mix(in srgb, var(--working) 80%, var(--cell0)); }
  .cell.w4 { background: var(--working); }
  .cell { transition: transform .15s ease; }
  .cell:active { transform: scale(.8); }
  .cell.sel { outline: 1.5px solid var(--fg); outline-offset: 1px; }
  .cell.pop { animation: pop .32s cubic-bezier(.3,.7,.2,1.4); }
  @keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
  .card.enter > * { animation: rise .26s cubic-bezier(.2,.7,.2,1) both; }
  .card.enter > *:nth-child(2) { animation-delay: .03s; }
  .card.enter > *:nth-child(3) { animation-delay: .06s; }
  .card.enter > *:nth-child(n+4) { animation-delay: .09s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fade { animation: fadein .22s ease both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  .cell.empty { background: transparent; cursor: default; }
  .legend { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding-inline: 2px; }
  .legend .cell { cursor: default; }
  .legend .gap { width: 4px; }
  .legend .item { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; }
  .syncrow {
    appearance: none; border: 0; background: none; cursor: pointer; padding: 2px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font: 300 13px/1.3 var(--font-ui); color: var(--muted); text-align: left;
  }
  .syncrow .go { font-size: 12px; font-weight: 500; color: var(--fg); flex: none; }
  .fieldwrap { display: flex; flex-direction: column; gap: 5px; padding-inline: 2px; }
  .fieldwrap .k { font-size: 12px; color: var(--muted); }
  .field {
    --field: rgba(118, 118, 128, .12);
    -webkit-user-select: text; user-select: text; min-width: 0; box-sizing: border-box;
    height: 32px; border-radius: 11px; border: 0; padding-inline: 12px;
    background: var(--field); color: var(--fg);
    font: 300 15px/1 var(--font-ui);
  }
  .field:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .skin {
    appearance: none; border: 0; padding: 0; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; gap: 5px;
    font: 400 12px/1.2 var(--font-ui); color: var(--muted); text-align: center;
    transition: transform .14s ease;
  }
  .skin:active { transform: scale(.96); }
  .skin .sw {
    height: 44px; border-radius: 11px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    display: flex; align-items: flex-end; justify-content: space-between; padding: 7px 8px;
  }
  .skin .sw i { display: block; width: 18px; height: 6px; border-radius: 3px; }
  .skin .sw b { display: block; width: 26px; height: 14px; border-radius: 5px; }
  .skin[aria-pressed="true"] { color: var(--fg); }
  .skin[aria-pressed="true"] .sw { box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 0 0 2px var(--card), 0 0 0 3.5px var(--fg); }
  .skin:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
  .section-k { font-size: 12px; color: var(--muted); padding-inline: 2px; }
  .section-k b { font-weight: 500; color: var(--fg); margin-right: 6px; }
  .sync-status { font-size: 16px; font-weight: 400; color: var(--fg); padding-inline: 2px; font-variant-numeric: tabular-nums; }
  .fieldrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .act.mini { height: 32px; border-radius: 11px; padding-inline: 16px; }

  /* success: the clock gives way to a ring that closes, then a check */
  .mark { display: none; width: 118px; height: 118px; margin-top: -4px; margin-bottom: -6px; overflow: visible; color: var(--accent); }
  .mark.prosing { color: var(--prosing); }
  .mark.working { color: var(--working); }
  .mark circle, .mark path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .mark .track { stroke: var(--line); stroke-width: 2.5; }
  .mark .ring { stroke-width: 3; stroke-dasharray: 100; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: 50px 50px; }
  .mark .check { stroke-width: 3.5; stroke-dasharray: 100; stroke-dashoffset: 0; }
  .top.won .clock { display: none; }
  .top.won .mark { display: block; }
  .mark.play { animation: markpop .42s 1.02s cubic-bezier(.3,.7,.2,1) both; }
  .mark.play .ring { animation: ringdraw .8s .08s cubic-bezier(.45,0,.2,1) both; }
  .mark.play .check { animation: checkdraw .36s .78s cubic-bezier(.3,.6,.3,1) both; }
  @keyframes ringdraw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes checkdraw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes markpop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .mark.play, .mark.play .ring, .mark.play .check { animation: none; } }
</style>

</head>
<body>

<div class="app">
  <div class="top">
    <div class="date" id="date">Wednesday, October 7</div>
    <div class="clock" id="clock">25:00</div>
    <svg class="mark" id="mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="44"/>
      <circle class="ring" cx="50" cy="50" r="44" pathLength="100"/>
      <path class="check" d="M34.5 51.5l11.5 11.5L69 39" pathLength="100"/>
    </svg>
  </div>

  <div class="middle"></div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="card" id="card"></div>

  <div class="bottom">
    <button class="tool" id="btn-sync" type="button" aria-label="GitHub Sync" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(.9) translate(-12 -12)" stroke-width="1.78"><path d="M19.5 9.5A8 8 0 0 0 5.2 7.2"/><path d="M5 3.5v4h4"/><path d="M4.5 14.5a8 8 0 0 0 14.3 2.3"/><path d="M19 20.5v-4h-4"/></g></svg></button>
    <span class="tools-right">
      <button class="tool" id="btn-cal" type="button" aria-label="History" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="8.5" cy="13.3" r=".6" fill="currentColor" stroke="none"/><circle cx="12" cy="13.3" r=".6" fill="currentColor" stroke="none"/><circle cx="15.5" cy="13.3" r=".6" fill="currentColor" stroke="none"/><circle cx="8.5" cy="16.8" r=".6" fill="currentColor" stroke="none"/><circle cx="12" cy="16.8" r=".6" fill="currentColor" stroke="none"/></svg></button>
      <button class="tool" id="btn-theme" type="button" aria-label="Theme" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5c.7 1.3 1.8 1.9 3 1.9s2.3-.6 3-1.9l5.5 2.4-1.9 4.2-2.3-.9v8.8H6.7v-8.8l-2.3.9-1.9-4.2L9 5z"/></svg></button>
    </span>
  </div>
</div>

<script>
(() => {
  const K = { skin: 'fg.skin', minutes: 'fg.minutes', records: 'fg.records', sessions: 'fg.sessions', session: 'fg.session', cat: 'fg.category', token: 'fg.token', repo: 'fg.repo', synced: 'fg.syncedAt' };
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const drop = (k) => { try { localStorage.removeItem(k); } catch (e) {} };

  const CATS = { prosing: 'Prosing', working: 'Working' };

  // ---------- skins ----------
  const SKINS = [
    ['default',   'Default',   '#f4f3ef', '#4f6478', '#ffffff'],
    ['claude',    'Claude',    '#f5f0e8', '#d97757', '#fffdf9'],
    ['obsidian',  'Obsidian',  '#ffffff', '#7f6df2', '#f6f6f6'],
    ['chocomint', 'Chocomint', '#e2f0e8', '#6b4532', '#f7fcf9'],
    ['lemonnavy', 'Lemon Navy', '#fbf6d8', '#1d3a8a', '#fffdf0'],
    ['coralbutter', 'Coral Butter', '#fff4d1', '#ff6f61', '#fffcf0'],
    ['blueprint', 'Blueprint', '#1d4c9c', '#ffffff', '#3a66b0'],
  ];
  function applySkin(k) {
    const root = document.documentElement;
    if (!SKINS.some((x) => x[0] === k) || k === 'default') delete root.dataset.skin; else root.dataset.skin = k;
    requestAnimationFrame(() => {
      const bg = getComputedStyle(document.body).backgroundColor;
      document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', bg));
    });
  }

  let minutes = load(K.minutes, 25);
  let category = load(K.cat, 'prosing');
  if (!CATS[category]) category = 'prosing';
  // legacy: day totals saved before sync existed { "2026-10-07": { s, n, c: { prosing: { s, n }, working: { s, n } } } }
  let legacy = load(K.records, {});
  // sessions: one entry per completed session { id, start, minutes, category } — merges cleanly across devices
  let sessions = load(K.sessions, []);
  let records = {};                          // derived day totals = legacy + sessions
  function rebuild() {
    records = JSON.parse(JSON.stringify(legacy));
    for (const x of sessions) {
      const key = dayKey(new Date(x.start));
      const r = records[key] || (records[key] = { s: 0, n: 0 });
      const add = x.minutes * 60;
      r.s += add; r.n += 1;
      r.c = r.c || {};
      const c = r.c[x.category] || (r.c[x.category] = { s: 0, n: 0 });
      c.s += add; c.n += 1;
    }
  }
  let session = load(K.session, null);      // { start, end, minutes, category }
  let phase = 'idle';                        // idle | picking | focusing | confirm | success | failed
  let view = 'timer';                        // timer | cal
  let filter = 'all';                        // all | prosing | working
  let last = { minutes, category };
  let failText = '';
  let celebrate = false;
  let countRaf = 0;
  let selected = null;
  let panel = 'history';                     // history | theme | sync (which card the bottom tools opened)
  let syncState = { busy: false, error: '' };

  const PRESETS = [[30, '30 min'], [60, '1 hour'], [90, '1.5 hours']];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtDur = (sec) => {
    const m = Math.floor(sec / 60);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h}h ${r}m` : `${h}h`;
  };
  const clock = (sec) => `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
  const hhmm = (t) => { const d = new Date(t); return `${d.getHours()}:${pad(d.getMinutes())}`; };
  const longDate = (d) => `${DOW_LONG[d.getDay()]}, ${MONTHS_LONG[d.getMonth()]} ${d.getDate()}`;
  rebuild();

  // ---------- timer logic ----------
  function start() {
    const now = Date.now();
    last = { minutes, category };
    session = { start: now, end: now + minutes * 60000, minutes, category };
    save(K.session, session);
    phase = 'focusing';
    render();
  }
  function complete() {
    const cat = session.category || 'prosing';
    sessions.push({ id: `${session.start}-${Math.random().toString(36).slice(2, 8)}`, start: session.start, minutes: session.minutes, category: cat });
    save(K.sessions, sessions);
    rebuild();
    sync();
    last = { minutes: session.minutes, category: cat };
    session = null; drop(K.session);
    phase = 'success';
    celebrate = true;                       // play the ring once, when the page is actually on screen
    render();
  }
  function fail(text) {
    if (session) last = { minutes: session.minutes, category: session.category || category };
    session = null; drop(K.session);
    failText = text;
    phase = 'failed';
    render();
  }
  // Any time the page is hidden (another app, home screen, or screen lock), the session ends.
  function leave() {
    if ((phase === 'focusing' || phase === 'confirm') && session) {
      if (Date.now() >= session.end) complete();
      else fail('You left the page, so the session stopped.');
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') leave();
    else if (phase === 'success' && celebrate && view === 'timer') render();
  });
  window.addEventListener('pagehide', leave);

  function tick() {
    if ((phase === 'focusing' || phase === 'confirm') && session) {
      const left = Math.max(0, Math.ceil((session.end - Date.now()) / 1000));
      setClock(left);
      if (left === 0) complete();
    }
  }
  setInterval(tick, 250);

  // ---------- building blocks ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const dot = (cat) => el('span', `dot ${cat}`);
  function act(label, cls, fn) {
    const b = el('button', `act ${cls || ''}`.trim(), label);
    b.type = 'button';
    b.addEventListener('click', fn);
    return b;
  }
  function head(title, sub, cat) {
    const h = el('div', 'card-head');
    const t = el('div', 'card-text');
    const tt = el('div', 'card-title');
    if (cat) tt.append(dot(cat));
    tt.append(document.createTextNode(title));
    t.append(tt);
    if (sub) t.append(el('div', 'card-sub', sub));
    h.append(t);
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    badge.setAttribute('viewBox', '0 0 24 24'); badge.setAttribute('class', 'badge');
    badge.innerHTML = '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
    h.append(badge);
    return h;
  }
  function actions(...btns) {
    const a = el('div', btns.length === 1 ? 'actions one' : 'actions');
    a.append(...btns);
    return a;
  }
  const segPrev = {};
  function segmented(name, options, value, onPick) {
    const s = el('div', 'seg');
    const n = options.length;
    const idx = Math.max(0, options.findIndex((o) => o[0] === value));
    const thumb = el('div', 'thumb');
    thumb.style.width = `calc((100% - 5px - ${(n - 1) * 4}px) / ${n})`;
    const at = (i) => `translateX(calc(${i * 100}% + ${i * 4}px))`;
    const from = segPrev[name] ?? idx;
    thumb.style.transition = 'none';
    thumb.style.transform = at(from);
    s.append(thumb);
    if (from !== idx) requestAnimationFrame(() => requestAnimationFrame(() => { thumb.style.transition = ''; thumb.style.transform = at(idx); }));
    else requestAnimationFrame(() => { thumb.style.transition = ''; });
    segPrev[name] = idx;
    for (const [key, label, withDot] of options) {
      const b = el('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(key === value));
      if (withDot) b.append(dot(key));
      b.append(document.createTextNode(label));
      b.addEventListener('click', () => onPick(key));
      s.append(b);
    }
    return s;
  }

  // ---------- wheel picker ----------
  function wheel(values, value, label, onChange) {
    const w = el('div', 'wheel');
    w.tabIndex = 0;
    w.setAttribute('role', 'spinbutton');
    w.setAttribute('aria-label', label);
    w.append(el('div', 'pad'));
    const items = values.map((v) => { const i = el('div', 'wi', String(v)); w.append(i); return i; });
    w.append(el('div', 'pad'));
    let row = 32, idx = Math.max(0, values.indexOf(value)), settle = 0, raf = 0;
    const paint = () => {
      raf = 0;
      const mid = w.scrollTop / row;
      items.forEach((it, i) => {
        const d = i - mid;
        if (Math.abs(d) > 3) { it.style.opacity = '0'; return; }
        if (Math.abs(d) < 0.04) { it.style.opacity = '1'; it.style.transform = 'none'; return; } // centred row renders as plain text, same as the buttons
        it.style.opacity = String(Math.max(0, 1 - Math.abs(d) * 0.3));
        it.style.transform = `rotateX(${-d * 20}deg) scale(${1 - Math.abs(d) * 0.06})`;
      });
    };
    const pick = (i) => {
      i = Math.max(0, Math.min(values.length - 1, i));
      if (i !== idx) { idx = i; w.setAttribute('aria-valuenow', values[i]); onChange(values[i]); }
    };
    w.addEventListener('scroll', () => {
      if (!raf) raf = requestAnimationFrame(paint);
      clearTimeout(settle);
      settle = setTimeout(() => { pick(Math.round(w.scrollTop / row)); paint(); }, 90);
    }, { passive: true });
    w.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); w.set(values[Math.max(0, Math.min(values.length - 1, idx + (e.key === 'ArrowDown' ? 1 : -1)))], true); }
    });
    items.forEach((it, i) => it.addEventListener('click', () => w.set(values[i], true)));
    w.set = (v, smooth) => {
      const i = values.indexOf(v); if (i < 0) return;
      w.scrollTo({ top: i * row, behavior: smooth ? 'smooth' : 'auto' });
      if (!smooth) { idx = i; paint(); }
    };
    requestAnimationFrame(() => {
      row = items[0] ? items[0].getBoundingClientRect().height || 32 : 32;
      w.scrollTop = idx * row; w.setAttribute('aria-valuenow', values[idx]); paint();
    });
    return w;
  }
  const fmtLen = (m) => {
    const h = Math.floor(m / 60), r = m % 60;
    if (!h) return `${r} minute session`;
    return r ? `${h} h ${r} min session` : `${h} hour session`;
  };
  function setClock(sec) {
    const ck = $('clock');
    ck.textContent = clock(sec);           // always minutes:seconds, e.g. 1.5 h → 90:00
    ck.classList.remove('long');
  }

  // ---------- render ----------
  let lastKey = '';
  const afterRender = () => requestAnimationFrame(placeTop);
  // before a session: the date/clock block sits at the top, as before.
  // while focusing: it is centred in the space between the window's top edge and the card's top edge.
  function placeTop() {
    const app = document.querySelector('.app'), top = document.querySelector('.top'), card = $('card');
    if (!app || !top || !card) return;
    const pad = parseFloat(getComputedStyle(app).paddingTop) || 0;
    let y = pad;
    if (view !== 'cal' && (phase === 'focusing' || phase === 'confirm' || phase === 'success')) {
      const ar = app.getBoundingClientRect();
      const cardTop = card.getBoundingClientRect().top - ar.top;
      y = Math.max(pad, (cardTop - top.offsetHeight) / 2);
    }
    top.style.top = `${Math.round(y)}px`;
  }
  window.addEventListener('resize', placeTop);

  function render() {
    const card = $('card'), ck = $('clock'), dt = $('date');
    card.replaceChildren();
    card.classList.remove('leave');
    const key = `${view}|${panel}|${view === 'timer' ? phase : ''}`;
    if (key !== lastKey) {
      card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
      lastKey = key;
    } else {
      card.classList.remove('enter');
    }
    const busy = phase === 'focusing' || phase === 'confirm';
    for (const [id, name] of [['btn-cal', 'history'], ['btn-theme', 'theme'], ['btn-sync', 'sync']]) {
      $(id).setAttribute('aria-pressed', String(view === 'cal' && panel === name));
      $(id).disabled = busy;
    }
    $('scrim').hidden = view !== 'cal';
    const today = new Date();

    // the top (date + timer) always shows the timer, whether or not history is open
    cancelAnimationFrame(countRaf);
    dt.textContent = `Today ${fmtDur(rec(today).s)}`;
    const won = phase === 'success' && view === 'timer';
    const top = document.querySelector('.top'), mark = $('mark');
    top.classList.toggle('won', won);
    mark.classList.remove('play', 'prosing', 'working');
    if (won) {
      mark.classList.add(last.category);
      if (celebrate && !document.hidden) {
        celebrate = false;
        void mark.getBoundingClientRect();
        mark.classList.add('play');
        // today's total counts up by the minutes just earned, as the ring closes
        const to = rec(today).s, from = Math.max(0, to - last.minutes * 60), t0 = performance.now() + 250;
        dt.textContent = `Today ${fmtDur(from)}`;
        const step = (t) => {
          const p = Math.min(1, Math.max(0, (t - t0) / 900));
          dt.textContent = `Today ${fmtDur(from + (to - from) * (1 - Math.pow(1 - p, 3)))}`;
          if (p < 1) countRaf = requestAnimationFrame(step);
        };
        countRaf = requestAnimationFrame(step);
      }
    }
    ck.classList.remove('small', 'long');
    ck.classList.toggle('dim', phase === 'success' || phase === 'failed');
    if (phase === 'idle' || phase === 'picking') setClock(minutes * 60);
    else if (phase === 'focusing' || phase === 'confirm') tick();
    else setClock(last.minutes * 60);

    if (view === 'cal') { if (panel === 'sync') renderSync(); else if (panel === 'theme') renderTheme(); else renderCal(); afterRender(); return; }
    afterRender();

    if (phase === 'idle') {
      setClock(minutes * 60);
      card.append(
        head(fmtLen(minutes), 'Leaving the page or locking the screen ends the session.'),
        segmented('category', [['prosing', 'Prosing', true], ['working', 'Working', true]], category,
          (k) => { category = k; save(K.cat, k); render(); }),
        actions(act('Duration', '', () => { phase = 'picking'; render(); }),
                act('Start', 'primary', start)));
    }

    if (phase === 'picking') {
      setClock(minutes * 60);
      const hd = head(fmtLen(minutes), 'Pick a preset, or scroll to set your own.');
      const chips = el('div', 'chips');
      const chipEls = [];
      let hWheel, mWheel;
      const sync = () => {
        save(K.minutes, minutes);
        setClock(minutes * 60);
        hd.querySelector('.card-title').lastChild.textContent = fmtLen(minutes);
        chipEls.forEach(([p, c]) => c.setAttribute('aria-pressed', String(p === minutes)));
      };
      for (const [p, label] of PRESETS) {
        const c = el('button', 'chipbtn', label);
        c.type = 'button';
        c.addEventListener('click', () => {
          minutes = p; sync();
          hWheel.set(Math.floor(p / 60), true); mWheel.set(p % 60, true);
        });
        chipEls.push([p, c]);
        chips.append(c);
      }
      minutes = Math.min(3 * 60 + 55, Math.max(5, Math.round(minutes / 5) * 5));   // wheels move in 5-minute steps, up to 3 h 55
      let hh = Math.floor(minutes / 60), mm = minutes % 60;
      const update = () => { minutes = Math.max(5, hh * 60 + mm); sync(); };
      hWheel = wheel([0, 1, 2, 3], hh, 'Hours', (v) => { hh = v; update(); });
      mWheel = wheel(Array.from({ length: 12 }, (_, i) => i * 5), mm, 'Minutes', (v) => { mm = v; update(); });
      const picker = el('div', 'picker');
      const colH = el('div', 'col'); colH.append(hWheel, el('span', 'unit', 'hours'));
      const colM = el('div', 'col'); colM.append(mWheel, el('span', 'unit', 'min'));
      picker.append(el('div', 'band'), colH, colM);
      sync();
      card.append(hd, chips, picker,
        actions(act('Done', 'primary', () => { phase = 'idle'; render(); })));
    }

    if (phase === 'focusing') {
      tick();
      card.append(
        head(CATS[session.category] || 'Focusing', `${session.minutes} minutes · ends at ${hhmm(session.end)}`, session.category),
        actions(act('Give up', '', () => { phase = 'confirm'; render(); })));
    }

    if (phase === 'confirm') {
      tick();
      card.append(
        head('Give up this session?', 'It won’t be added to your history.', session.category),
        actions(act('Keep going', '', () => { phase = 'focusing'; render(); }),
                act('Give up', 'primary', () => fail('You gave up this session.'))));
    }

    if (phase === 'success') {
      setClock(last.minutes * 60);
      card.append(
        head('Session complete', `${last.minutes} minutes of ${CATS[last.category].toLowerCase()} added to today.`, last.category),
        actions(act('History', '', () => { phase = 'idle'; view = 'cal'; panel = 'history'; selected = null; render(); }),
                act('OK', 'primary', () => { phase = 'idle'; render(); })));
    }

    if (phase === 'failed') {
      setClock(last.minutes * 60);
      card.append(
        head('Session stopped', failText, last.category),
        actions(act('Try again', 'primary', () => { phase = 'idle'; render(); })));
    }
  }

  // ---------- history ----------
  const WEEKS = 53;
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const mondayOf = (d) => addDays(startOfDay(d), -((d.getDay() + 6) % 7));
  function rec(d) { return records[dayKey(d)] || { s: 0, n: 0 }; }
  function stat(d, f) {
    const r = rec(d);
    if (f === 'all') return { s: r.s, n: r.n };
    return (r.c && r.c[f]) || { s: 0, n: 0 };
  }
  const lvl = (s) => s === 0 ? 0 : s < 1800 ? 1 : s < 3600 ? 2 : s < 7200 ? 3 : 4;
  // All = gray; Prosing / Working = that category's color
  const shade = () => filter === 'prosing' ? 'p' : filter === 'working' ? 'w' : 'l';
  function cellClass(d) {
    const l = lvl(stat(d, filter).s);
    return l ? `${shade()}${l}` : '';
  }
  // the sessions behind one day, oldest first
  function daySessions(d) {
    const k = dayKey(d);
    return sessions.filter((x) => dayKey(new Date(x.start)) === k && (filter === 'all' || x.category === filter))
      .sort((a, b) => a.start - b.start);
  }

  function renderCal() {
    const today = startOfDay(new Date());
    const d = selected || today;
    const st = stat(d, filter);
    const isToday = dayKey(d) === dayKey(today);

    const day = el('div', 'day');
    const list = daySessions(d);
    const shown = list.slice(-4);
    if (list.length > shown.length) day.append(el('div', 'more', `+ ${list.length - shown.length} earlier`));
    for (const x of shown) {
      const line = el('div', 'sline');
      line.append(dot(x.category), el('span', 't', hhmm(x.start)), el('span', 'cat', CATS[x.category] || ''), el('span', 'dur', fmtDur(x.minutes * 60)));
      day.append(line);
    }
    const sessSec = list.reduce((a, x) => a + x.minutes * 60, 0);
    const older = st.s - sessSec;              // time saved before per-session records existed
    if (older > 0) {
      const line = el('div', 'sline');
      line.append(el('span'), el('span', 't', '—'), el('span', 'cat', 'Earlier'), el('span', 'dur', fmtDur(older)));
      day.append(line);
    }

    const mon = mondayOf(today);
    let week = 0;
    for (let i = 0; i <= 6; i++) { const x = addDays(mon, i); if (x <= today) week += stat(x, filter).s; }
    let total = 0;
    for (const key of Object.keys(records)) {
      const r = records[key];
      total += filter === 'all' ? r.s : ((r.c && r.c[filter]) || { s: 0 }).s;
    }

    const card = $('card');
    const seg = segmented('filter', [['all', 'All', false], ['prosing', 'Prosing', true], ['working', 'Working', true]], filter,
      (k) => { const o = document.querySelector('.graph-scroll'); const keep = o ? o.scrollLeft : 0; filter = k; render(); if (selected) { const n = document.querySelector('.graph-scroll'); if (n) n.scrollLeft = keep; } });

    const stats = el('div', 'stats');
    const dayLabel = isToday ? 'Today' : `${MONTHS[d.getMonth()]} ${d.getDate()}`;
    for (const [k, v] of [[dayLabel, fmtDur(st.s)], ['This week', fmtDur(week)], ['Total', fmtDur(total)]]) {
      const s = el('div', 'stat'); s.append(el('div', 'k', k), el('div', 'v', v)); stats.append(s);
    }

    const wrap = el('div', 'graph-wrap');
    const wk = el('div', 'wk');
    for (const t of ['', 'Mon', '', 'Wed', '', 'Fri', '', '']) wk.append(el('span', '', t));
    const sc = el('div', 'graph-scroll');
    const g = el('div', 'graph');
    const first = addDays(mon, -(WEEKS - 1) * 7);
    let prevMonth = -1;
    for (let w = 0; w < WEEKS; w++) {
      const colStart = addDays(first, w * 7);
      const m = colStart.getMonth();
      g.append(el('div', 'mlabel', w > 0 && m !== prevMonth ? MONTHS[m] : ''));
      prevMonth = m;
      for (let i = 0; i < 7; i++) {
        const day = addDays(colStart, i);
        const cell = el('button');
        cell.type = 'button';
        if (day > today) { cell.className = 'cell empty'; cell.disabled = true; cell.tabIndex = -1; }
        else {
          cell.className = `cell ${cellClass(day)}`.trim();
          if (dayKey(day) === dayKey(d)) cell.classList.add('sel');
          cell.setAttribute('aria-label', `${MONTHS[day.getMonth()]} ${day.getDate()}, ${fmtDur(stat(day, filter).s)}`);
          cell.addEventListener('click', () => {
            const keep = sc.scrollLeft;
            selected = day; render();
            const nsc = document.querySelector('.graph-scroll'); if (nsc) nsc.scrollLeft = keep;
            const ns = document.querySelector('.cell.sel'); if (ns) ns.classList.add('pop');
          });
        }
        g.append(cell);
      }
    }
    sc.append(g);
    wrap.append(wk, sc);

    const legend = el('div', 'legend');
    legend.append(el('span', '', 'Less'), el('span', 'gap'), el('span', 'cell'));
    for (const l of [1, 2, 3, 4]) legend.append(el('span', `cell ${shade()}${l}`));
    legend.append(el('span', 'gap'), el('span', '', 'More'));

    card.append(seg, stats);
    if (day.childElementCount) card.append(day);
    card.append(el('div', 'rule'), wrap, legend);
    if (!selected) {
      sc.scrollLeft = sc.scrollWidth;
      requestAnimationFrame(() => { sc.scrollLeft = sc.scrollWidth; });
    }
  }

  // ---------- GitHub sync ----------
  const getToken = () => load(K.token, '');
  const getRepo = () => load(K.repo, 'bambusaceae/focus-data');
  function syncLabel() {
    if (!getToken()) return 'GitHub Sync is off';
    if (syncState.busy) return 'Syncing…';
    if (syncState.error) return `Sync failed: ${syncState.error}`;
    const t = load(K.synced, 0);
    if (!t) return 'Not synced yet';
    const d = new Date(t);
    return dayKey(d) === dayKey(new Date()) ? `Synced at ${hhmm(t)}` : `Synced ${MONTHS[d.getMonth()]} ${d.getDate()}, ${hhmm(t)}`;
  }
  const b64encode = (str) => { const bytes = new TextEncoder().encode(str); let bin = ''; for (const b of bytes) bin += String.fromCharCode(b); return btoa(bin); };
  const b64decode = (b64) => { const bin = atob(b64.replace(/\s/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); };

  function mergeData(remote) {
    // sessions: union by id
    const ids = new Set(sessions.map((x) => x.id));
    for (const x of (remote.sessions || [])) if (!ids.has(x.id)) { sessions.push(x); ids.add(x.id); }
    sessions.sort((a, b) => a.start - b.start);
    // legacy totals: keep the larger value per day and category
    for (const [key, r] of Object.entries(remote.legacy || {})) {
      const mine = legacy[key];
      if (!mine) { legacy[key] = r; continue; }
      if (r.s > mine.s) { mine.s = r.s; mine.n = r.n; }
      for (const [cat, v] of Object.entries(r.c || {})) {
        mine.c = mine.c || {};
        if (!mine.c[cat] || v.s > mine.c[cat].s) mine.c[cat] = v;
      }
    }
    save(K.sessions, sessions);
    save(K.records, legacy);
    rebuild();
  }

  async function api(path, opts = {}) {
    const res = await fetch(`https://api.github.com/repos/${getRepo()}/contents/${path}`, {
      ...opts,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${getToken()}`,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      },
      cache: 'no-store',
    });
    return res;
  }

  async function sync() {
    if (!getToken() || syncState.busy || !navigator.onLine) return;
    syncState = { busy: true, error: '' };
    if (view === 'cal') render();
    try {
      for (let attempt = 0; attempt < 2; attempt++) {
        let sha;
        const get = await api('data.json');
        if (get.status === 200) {
          const j = await get.json();
          sha = j.sha;
          mergeData(JSON.parse(b64decode(j.content)));
        } else if (get.status === 401) {
          throw new Error('the token was rejected');
        } else if (get.status === 404) {
          const probe = await fetch(`https://api.github.com/repos/${getRepo()}`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
          if (probe.status !== 200) throw new Error('repository not found');
        } else {
          throw new Error(`GitHub error ${get.status}`);
        }
        const body = { message: `Update focus data ${new Date().toISOString()}`, content: b64encode(JSON.stringify({ version: 1, legacy, sessions }, null, 1)) };
        if (sha) body.sha = sha;
        const put = await api('data.json', { method: 'PUT', body: JSON.stringify(body) });
        if (put.ok) { save(K.synced, Date.now()); syncState = { busy: false, error: '' }; break; }
        if ((put.status === 409 || put.status === 422) && attempt === 0) continue; // changed elsewhere; fetch again and retry
        if (put.status === 403 || put.status === 404) throw new Error('the token can’t write to this repository');
        throw new Error(`GitHub error ${put.status}`);
      }
    } catch (e) {
      syncState = { busy: false, error: (e && e.message) || 'network error' };
    }
    if (syncState.busy) syncState.busy = false;
    if (view === 'cal' || phase === 'idle') render();
  }

  function renderSync() {
    const card = $('card');

    const tokenIn = el('input', 'field');
    tokenIn.id = 'sync-token'; tokenIn.type = 'password'; tokenIn.autocomplete = 'off';
    tokenIn.placeholder = getToken() ? 'Saved · paste to replace' : 'Paste your fine-grained token';
    const repoIn = el('input', 'field');
    repoIn.id = 'sync-repo'; repoIn.type = 'text'; repoIn.autocapitalize = 'off'; repoIn.spellcheck = false;
    repoIn.value = getRepo();
    const lab = (t, f) => { const w = el('label', 'fieldwrap'); w.append(el('span', 'k', t), f); return w; };


    const syncBtn = act('Sync', 'primary mini', async () => {
      const t = tokenIn.value.trim();
      if (t) save(K.token, t);
      save(K.repo, repoIn.value.trim() || 'bambusaceae/focus-data');
      await sync();
      render();
    });
    const tokenRow = el('div', 'fieldrow');
    tokenRow.append(lab('Token', tokenIn), syncBtn);
    const status = el('div', 'sync-status', syncLabel());
    const syncHead = el('div', 'section-k');
    syncHead.append(el('b', '', getToken() ? 'Reconnect' : 'Connect to GitHub'));
    card.append(status, el('div', 'rule'), syncHead, lab('Repository', repoIn), tokenRow);
  }
  function renderTheme() {
    const card = $('card');
    const skins = el('div', 'skins');
    let cur = load(K.skin, 'default'); if (!SKINS.some((x) => x[0] === cur)) cur = 'default';
    for (const [k, name, bg, accent, card2] of SKINS) {
      const b = el('button', 'skin');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(k === cur));
      const sw = el('span', 'sw'); sw.style.background = bg;
      const bar = el('i'); bar.style.background = card2 === bg ? '#e5e5e5' : card2;
      const pill = el('b'); pill.style.background = accent;
      sw.append(bar, pill);
      b.append(sw, document.createTextNode(name));
      b.addEventListener('click', () => { save(K.skin, k); applySkin(k); render(); });
      skins.append(b);
    }
    const themeHead = el('div', 'section-k');
    themeHead.append(el('b', '', 'Theme'));
    card.append(themeHead, skins);
  }
  window.addEventListener('online', () => sync());

  // ---------- bottom buttons ----------
  function openPanel(name) {
    if (phase === 'focusing' || phase === 'confirm') return;
    if (view === 'cal' && panel === name) { closeHistory(); return; }
    selected = null; panel = name; view = 'cal'; render();
  }
  function closeHistory() {
    if (view !== 'cal') return;
    const card = $('card');
    $('scrim').hidden = true;
    card.classList.remove('enter'); card.classList.add('leave');
    setTimeout(() => { view = 'timer'; render(); }, 150);
  }
  $('btn-cal').addEventListener('click', () => openPanel('history'));
  $('btn-theme').addEventListener('click', () => openPanel('theme'));
  $('btn-sync').addEventListener('click', () => openPanel('sync'));
  $('scrim').addEventListener('click', closeHistory);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHistory(); });

  // ---------- touch ----------
  document.addEventListener('touchstart', () => {}, { passive: true });   // lets :active press states show on iOS
  document.addEventListener('gesturestart', (e) => e.preventDefault()); // block pinch zoom

  // ---------- boot ----------
  applySkin(load(K.skin, 'default'));
  // A session still saved at launch means the page was closed mid-session.
  if (session) {
    last = { minutes: session.minutes, category: session.category || category };
    if (Date.now() >= session.end) complete();
    else fail('You left the page, so the session stopped.');
  }
  render();
  sync();
  setInterval(() => { $('date').textContent = `Today ${fmtDur(rec(new Date()).s)}`; }, 60000);
})();
</script>

</body>
